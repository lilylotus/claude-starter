plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cn.nihility'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public/' }
	mavenCentral()
}

ext {
    set('FlowableVersion', "7.2.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	/* springdoc 3.x 目标 Spring Boot 4，与本项目的 Spring Boot 3.5 不兼容，固定使用 2.x 系列的最新版 */
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    implementation 'org.mapstruct:mapstruct:1.6.3'

    implementation 'org.flywaydb:flyway-mysql:12.8.1'
    implementation 'com.mysql:mysql-connector-j:9.6.0'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    implementation 'org.mybatis:mybatis-spring:3.0.5'
    /* MyBatis-Plus 3.5.x 把分页拦截器依赖的 JSQLParser 拆到了独立模块，
       PaginationInnerInterceptor 需要它才能生效 */
    implementation 'com.baomidou:mybatis-plus-jsqlparser:3.5.16'
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.16'

    /* excel 操作 */
    implementation 'org.apache.poi:poi:5.4.1'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'org.apache.xmlbeans:xmlbeans:5.3.0'

    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'

    /* 转换脚本语法校验（不执行），23.1.x 版本线对应 "GraalVM for JDK 21" LTS 发行版，
       与本项目 JDK 21 工具链对齐；js-community 为纯 Java 解释执行实现，不需要
       GraalVM 原生发行版，可在标准 OpenJDK 21 上运行 */
    implementation 'org.graalvm.polyglot:polyglot:23.1.12'
    implementation 'org.graalvm.polyglot:js-community:23.1.12'

    implementation 'com.lmax:disruptor:4.0.0'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.4'

    /* 流程管理 */
    implementation "org.flowable:flowable-spring-boot-starter:${FlowableVersion}"
    // ============ Flowable 核心：流程引擎 ============
    implementation "org.flowable:flowable-spring-boot-starter-process:${FlowableVersion}"
    // ============ 可选：Flowable REST API ============
    implementation "org.flowable:flowable-spring-boot-starter-rest:${FlowableVersion}"

    implementation 'io.netty:netty-all:4.2.16.Final'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    /* 聊天网关（chat-gateway-core change design.md Decision 6）：msgId 去重短路缓存 +
       连接/消息令牌桶按访问频率淘汰，避免无界 Map 长期占用内存。 */
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

clean {
    // 额外删除 IDE 生成的 out 目录
    println("====clean====")
    println(rootDir)
    println(projectDir)
    delete "${rootDir}/out"
    delete "${rootDir}/build"
    delete "${rootDir}/src/main/generated"
}

//tasks.withType(JavaCompile).configureEach {
//    dependsOn clean
//}

tasks.named('test') {
	useJUnitPlatform()
	/* 聊天网关（ChatGatewayServer）是一个随 Spring 容器启动即绑定真实 Netty 端口的
	   SmartLifecycle Bean，与内嵌 Servlet 容器的 webEnvironment 类型无关；测试套件里
	   大量 @SpringBootTest 用例按各自不同的 Mock/属性组合分别持有独立的 Spring 上下文
	   缓存条目，每个新建的上下文都会尝试绑定同一个端口（chat.gateway.port），第一个
	   之后的全部会因端口被占用而启动失败，进而波及该上下文下的全部测试用例。测试运行时
	   通过 chat.gateway.enabled=false 整体关闭端口监听（该开关本身即为"问题回滚不需要
	   回退代码"而设计，这里复用其语义），不影响 chat 模块自身单元测试（均为不依赖
	   Spring 容器的纯 Mockito 单元测试）。 */
	systemProperty 'chat.gateway.enabled', 'false'
}

/* Gradle 指定编码,Java 编译的时候缺省状态下会因为中文字符而失败 */
[compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:deprecation"
}
