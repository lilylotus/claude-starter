server:
  port: 48080

spring:
  application:
    name: RBAC

  # 以下数据源配置为本地开发占位值（localhost:3306 / rbac_demo / root / root），
  # 仅用于离线编译和联调脚手架，各环境（测试/预发/生产）务必替换为各自的真实连接信息，
  # 不要把生产凭据提交到仓库。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rbac?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: mysql

  # 数据库版本由 Flyway 管理，迁移脚本位于 src/main/resources/db/migration，
  # 命名规范为 V<版本号>__<描述>.sql
  # 避免应用启动阶段因连接失败而报错；连接到真实数据库后再打开。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  config-location: classpath:mybatis/mybatis.conf
  mapper-locations: classpath*:mybatis/mapper/*.xml
  global-config:
    db-config:
      id-type: auto

# 本地开发时打印 MyBatis-Plus 执行的 SQL，便于联调排查；生产环境按需调低。
logging:
  level:
    cn.nihility.rbac: debug
