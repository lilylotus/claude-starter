server:
  port: 48080

spring:
  application:
    name: RBAC

  main:
    # 允许同名 Bean 定义重复注册（后注册覆盖先注册），插件覆盖主程序 Bean 依赖该开关
    # （plugin-jar-upgrade change design.md Decision 3）。
    allow-bean-definition-overriding: true

  # Excel 批量导入上传文件的大小限制，默认的 1MB 单文件上限不足以覆盖上限 1000 行
  # 的导入场景，适当调大；具体行数上限由业务层（BatchImportServiceImpl）控制。
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 以下数据源配置为本地开发占位值（localhost:3306 / rbac_demo / root / root），
  # 仅用于离线编译和联调脚手架，各环境（测试/预发/生产）务必替换为各自的真实连接信息，
  # 不要把生产凭据提交到仓库。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # nullCatalogMeansCurrent=true 避免 Flowable 在同一 MySQL 实例的其他数据库中发现 ACT_* 表后，
    # 误判当前数据库已完成初始化并错误执行升级脚本。
    url: jdbc:mysql://10.10.88.31:3306/rbac?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
    username: root
    password: mysql

  data:
    redis:
      database: 8
      password: redis
      host: 10.10.88.31
      port: 6379
      connect-timeout: 3000ms

  # 数据库版本由 Flyway 管理，迁移脚本位于 src/main/resources/db/migration，
  # 命名规范为 V<版本号>__<描述>.sql
  # 避免应用启动阶段因连接失败而报错；连接到真实数据库后再打开。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # `flowable-spring-boot-starter-rest` 引入的 `org.flowable.spring.boot.RestApiAutoConfiguration`
  # 会为 process/idm/app/cmmn/dmn/eventregistry 等每个引擎各自注册一个独立的内嵌
  # DispatcherServlet（默认路径如 /process-api、/idm-api），且没有任何 `flowable.*` 配置项
  # 能单独关闭这批自动路由（已反编译确认：注册条件仅为 @ConditionalOnClass(RestUrls.class) +
  # @ConditionalOnBean(ProcessEngine.class) 等，字节码里没有引用任何 rest-api-enabled 之类的
  # 属性判断）；这些内嵌 Servlet 仍会被 IdentityAuthFilter（url-pattern=/*，作用于容器级别，
  # 覆盖同一上下文内的全部 Servlet）拦截、要求 identity-token，但其 menu 请求头校验只判断
  # "调用方是否持有某个已存在的权限编码"，不校验该编码是否与被访问的具体 URL 相关，等价于
  # "任意已登录且拥有任意一个权限点的用户" 都能访问 Flowable 原始引擎数据/操作接口，超出预期
  # 授权范围，因此用 Spring Boot 标准的 `spring.autoconfigure.exclude` 整体排除该自动配置类，
  # 只保留 Java API（RuntimeService/TaskService）编程调用能力（design.md Decision 3/4）。
  autoconfigure:
    exclude:
      - org.flowable.spring.boot.RestApiAutoConfiguration

mybatis-plus:
  config-location: classpath:mybatis/mybatis.conf
  mapper-locations: classpath*:mybatis/mapper/*.xml
  global-config:
    db-config:
      id-type: auto

# Flowable 流程引擎配置（add-master-data-approval-workflow change design.md Decision 4）。
# 仅借助 Flowable 做审批申请的状态机（流程实例启动/用户任务完成/流程实例终止），不接入
# 其 REST 自动路由与 IDM 身份体系，避免与项目自有的 IdentityAuthFilter 鉴权机制、
# RBAC 权限点体系产生第二套并行机制。
#
flowable:
  # Flowable 自身的 ACT_* 系列表由其官方维护版本演进，首次启动自动建表，不纳入本项目
  # Flyway 迁移脚本管理（这些表的 schema 演进由 Flowable 自身版本负责）。
  database-schema-update: true
  # 本次只使用 BPMN ProcessEngine。通用 starter 默认还会启动 App/CMMN/DMN/EventRegistry/IDM
  # 引擎，显式关闭这些未使用的引擎，避免创建无关的运行时组件和数据库表。
  app:
    enabled: false
  cmmn:
    enabled: false
  dmn:
    enabled: false
  eventregistry:
    enabled: false
  idm:
    enabled: false
  # 关闭异步执行器：本次接入只用同步的 RuntimeService/TaskService API 编程调用
  # （启动流程实例、完成用户任务、终止流程实例），没有定时器/异步延续任务场景，
  # 不需要额外的调度线程池。
  async-executor-activate: false

# 本地开发时打印 MyBatis-Plus 执行的 SQL，便于联调排查；生产环境按需调低。
logging:
  level:
    cn.nihility.rbac: debug

rbac:
  user:
    login:
      # 以下 RSA-2048 密钥对（X.509/PKCS8 DER + Base64，用 RsaJdkUtils.generateKeyPair()
      # 生成）仅用于本地开发/演示，生产环境务必替换为独立生成的密钥对，不要沿用仓库中的默认值。
      public-key: 
      private-key: 
      # access-key 有效期（秒），默认 7200 秒（2 小时）
      access-token-expire-seconds: 7200
      # refresh-key 有效期（秒），默认 14400 秒（4 小时）
      refresh-token-expire-seconds: 14400

  app-secret:
    # SM4 密钥（Base64，16 字节，用 Sm4JdkUtils.generateKey() 生成），用于应用对外接口
    # SecretKey 落库前的对称加密；仅用于本地开发/演示，生产环境务必替换为独立生成的密钥，
    # 不要沿用仓库中的默认值。
    sm4-key: R8r2MjLGO0oLMkIVVXcPrQ==

  # HttpClientUtils 统一 HTTP 客户端配置（app-sync-notify-pull-api change design.md
  # Decision 11），全部为默认值，此处显式列出便于按需覆盖。
  http-client:
    connect-timeout-millis: 5000
    response-timeout-millis: 5000
    max-total: 200
    max-per-route: 50
    skip-ssl-verify: false

  # 数据同步事件总线配置（app-sync-notify-pull-api change design.md Decision 4）。
  sync:
    ring-buffer-size: 1024
    worker-id: 0

    rate-limit:
      pull-tokens-per-second: 10
      pull-burst-capacity: 30
      digest-tokens-per-second: 1
      digest-burst-capacity: 3
      max-page-size: 500
      max-ids: 200
      max-org-scope-roots: 100

    # 全局变更流水表定期清理配置（app-sync-changelog-pull change design.md Decision 8），
    # 全部为默认值，此处显式列出便于按需覆盖。
    change-log-cleanup:
      # 清理任务执行时间点的 cron 表达式，默认每天凌晨 1 点 30 分执行一次。
      cron: "0 30 1 * * ?"
      # 变更流水保留天数，默认 90 天。
      retention-days: 90
      # 每批删除的记录数上限，默认 1000。
      batch-size: 1000

    # 通知任务重试/死信状态机配置（app-sync-changelog-pull change design.md Decision 6），
    # 全部为默认值，此处显式列出便于按需覆盖。
    notify-retry:
      # 第一次失败后的重试等待（秒）。
      initial-interval-seconds: 30
      # 指数退避倍数。
      multiplier: 2.0
      # 单次退避等待上限（秒）。
      max-interval-seconds: 3600
      # 达到后转 DEAD 的最大尝试次数。
      max-attempts: 8
      # PROCESSING 状态的租约时长（秒），需明显大于通知请求响应超时（3 秒）。
      lease-seconds: 60
      # 独立调度器扫描到期任务的轮询间隔（秒）。
      scheduler-poll-interval-seconds: 30
      # 调度器单轮最多抢占的任务数。
      scheduler-batch-size: 100

  # SSO 单点登录运行时配置（app-sso-protocol-runtime change design.md Decision 2/5/6），
  # 全部为默认值，此处显式列出便于按需覆盖。
  sso:
    # SSO 会话 Cookie 是否追加 Secure 属性，本地 http 开发环境保持 false，
    # 生产环境部署在 https 之后应改为 true。
    cookie-secure: false
    # SSO 会话有效期（秒），默认 28800 秒（8 小时），固定过期，不做滑动续期。
    session-expire-seconds: 28800
    # CAS 服务票据（ST）有效期（秒），默认 120 秒，一次性短期凭证。
    cas-ticket-expire-seconds: 120
    # OAuth2 授权码有效期（秒），默认 300 秒（5 分钟）。
    oauth-code-expire-seconds: 300
    # OAuth2 access token 有效期（秒），默认 7200 秒（2 小时）。
    oauth-token-expire-seconds: 7200
    # OAuth2 refresh token 有效期（秒），默认 86400 秒（1 天，add-sso-single-logout change
    # design.md Decision 6，刷新时轮转签发新值，接入方须保证至少每天刷新一次）。
    oauth-refresh-token-expire-seconds: 86400

  # 登录日志/操作日志定期清理配置（close-sso-log-and-policy-gaps change design.md
  # Decision 4），两张表共用同一份 cron/保留天数配置，全部为默认值，此处显式列出便于按需覆盖。
  log-cleanup:
    # 清理任务执行时间点的 cron 表达式，默认每天凌晨 1 点执行一次。
    cron: "0 0 1 * * ?"
    # 日志保留天数，默认 180 天（半年），创建时间早于"当前时间 - 保留天数"的记录会被清理。
    retention-days: 180

  # 插件包升级相关配置（plugin-jar-upgrade change design.md Decision 1/5/6），全部为默认值，
  # 此处显式列出便于按需覆盖；插件目录路径为相对路径时相对于应用当前工作目录解析。
  plugin:
    # 插件目录路径，应用启动时（主程序组件扫描完成后、任何 Bean 实例化前）扫描该目录下的
    # .jar 文件；目录不存在时跳过插件加载流程，不影响主程序正常启动。
    directory: plugins
    override:
      # 覆盖黑名单：命中的目标类全限定名禁止被插件覆盖（安全关键组件），默认包含认证过滤器、
      # 全局异常处理器、全局响应包装器；部署方可追加，不建议移除默认项。
      deny-list:
        - cn.nihility.rbac.auth.filter.IdentityAuthFilter
        - cn.nihility.rbac.common.exception.GlobalExceptionHandler
        - cn.nihility.rbac.common.advice.GlobalResponseAdvice
