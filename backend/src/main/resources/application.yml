server:
  port: 48080

spring:
  application:
    name: RBAC

  # Excel 批量导入上传文件的大小限制，默认的 1MB 单文件上限不足以覆盖上限 1000 行
  # 的导入场景，适当调大；具体行数上限由业务层（BatchImportServiceImpl）控制。
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 以下数据源配置为本地开发占位值（localhost:3306 / rbac_demo / root / root），
  # 仅用于离线编译和联调脚手架，各环境（测试/预发/生产）务必替换为各自的真实连接信息，
  # 不要把生产凭据提交到仓库。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/rbac?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: mysql

  data:
    redis:
      database: 8
      password: redis
      host: 127.0.0.1
      port: 6379
      connect-timeout: 3000ms

  # 数据库版本由 Flyway 管理，迁移脚本位于 src/main/resources/db/migration，
  # 命名规范为 V<版本号>__<描述>.sql
  # 避免应用启动阶段因连接失败而报错；连接到真实数据库后再打开。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  config-location: classpath:mybatis/mybatis.conf
  mapper-locations: classpath*:mybatis/mapper/*.xml
  global-config:
    db-config:
      id-type: auto

# 本地开发时打印 MyBatis-Plus 执行的 SQL，便于联调排查；生产环境按需调低。
logging:
  level:
    cn.nihility.rbac: debug

rbac:
  user:
    login:
      # 以下 RSA-2048 密钥对（X.509/PKCS8 DER + Base64，用 RsaJdkUtils.generateKeyPair()
      # 生成）仅用于本地开发/演示，生产环境务必替换为独立生成的密钥对，不要沿用仓库中的默认值。
      public-key: 
      private-key: 
      # access-key 有效期（秒），默认 7200 秒（2 小时）
      access-token-expire-seconds: 7200
      # refresh-key 有效期（秒），默认 14400 秒（4 小时）
      refresh-token-expire-seconds: 14400
